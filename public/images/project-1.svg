      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#152b4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19b5fe"/>
      <stop offset="1" stop-color="#1475e8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="28" fill="url(#bg)"/>
